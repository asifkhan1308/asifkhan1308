name: Kaatchat

on:
  push:
    branches: [main, 'claude/**']
    paths: ['kaatchat/**', '.github/workflows/kaatchat.yml']
    tags: ['kaatchat-v*']
  pull_request:
    paths: ['kaatchat/**', '.github/workflows/kaatchat.yml']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: kaatchat

jobs:
  web:
    name: Web — lint, typecheck, unit, build, E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kaatchat/package-lock.json
      - name: Install ffmpeg (test fixtures and export verification)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-dist
          path: kaatchat/dist
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: kaatchat/test-results

  desktop:
    name: Desktop — policy tests and Electron smoke test
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            kaatchat/package-lock.json
            kaatchat/desktop/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb
      - run: npm ci
      - run: npm ci
        working-directory: kaatchat/desktop
      - run: npm test
        working-directory: kaatchat/desktop
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: kaatchat/dist
      - run: npm --prefix desktop run copy-web
      - run: xvfb-run -a npx playwright test -c playwright.desktop.config.ts

  windows-installer:
    name: Windows installer
    # Never publish if any test failed.
    needs: [web, desktop]
    if: startsWith(github.ref, 'refs/tags/kaatchat-v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            kaatchat/package-lock.json
            kaatchat/desktop/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: kaatchat/dist
      - run: npm ci
        working-directory: kaatchat/desktop
      - name: Build NSIS installer
        working-directory: kaatchat/desktop
        env:
          # Signing is used automatically when these secrets exist; otherwise the build is unsigned.
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run dist:win
      - name: Checksums
        shell: pwsh
        working-directory: kaatchat/desktop/release
        run: |
          Get-ChildItem *.exe | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name } | Tee-Object SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            kaatchat/desktop/release/*.exe
            kaatchat/desktop/release/SHA256SUMS.txt
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/kaatchat-v')
        shell: pwsh
        working-directory: kaatchat/desktop/release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $signed = if ("${{ secrets.WIN_CSC_LINK }}" -ne "") { "Signed" } else { "**Unsigned build.** Windows SmartScreen may warn that the publisher is unknown. Verify the SHA-256 below before running." }
          $sums = Get-Content SHA256SUMS.txt -Raw
          $notes = "Kaatchat ${{ github.ref_name }}`n`n$signed`n`nSystem requirements: Windows 10/11 64-bit, a GPU/CPU with hardware video decode recommended.`n`nSHA-256:`n``````n$sums``````"
          gh release create "${{ github.ref_name }}" (Get-ChildItem *.exe).FullName SHA256SUMS.txt --title "Kaatchat ${{ github.ref_name }}" --notes $notes --prerelease
