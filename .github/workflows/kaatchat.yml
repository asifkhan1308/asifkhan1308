name: Kaatchat

on:
  push:
    branches: [main, 'claude/**']
    paths: ['kaatchat/**', '.github/workflows/kaatchat.yml']
    tags: ['kaatchat-v*']
  pull_request:
    paths: ['kaatchat/**', '.github/workflows/kaatchat.yml']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the installer as a GitHub Release (tag kaatchat-v<desktop version>, created on this commit)'
        type: boolean
        default: false

permissions:
  contents: read

defaults:
  run:
    working-directory: kaatchat

jobs:
  web:
    name: Web — lint, typecheck, unit, build, E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kaatchat/package-lock.json
      - name: Install ffmpeg and espeak-ng (test media, export checks, real speech for Whisper)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng
      - run: npm ci --ignore-scripts  # skips onnxruntime-node's unused native download (the app uses onnxruntime-web)
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          # Real Whisper: download the model from Hugging Face and transcribe real speech.
          KAATCHAT_WHISPER_E2E: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-dist
          path: kaatchat/dist
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: kaatchat/test-results

  desktop:
    name: Desktop — policy tests and Electron smoke test
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            kaatchat/package-lock.json
            kaatchat/desktop/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb
      - run: npm ci --ignore-scripts  # skips onnxruntime-node's unused native download (the app uses onnxruntime-web)
      - run: npm ci
        working-directory: kaatchat/desktop
      - run: npm test
        working-directory: kaatchat/desktop
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: kaatchat/dist
      - run: npm --prefix desktop run copy-web
      # Ubuntu 24.04 runners block the unprivileged user namespaces Chromium's sandbox
      # needs, so Electron fails to launch. Lift that runner restriction rather than
      # passing --no-sandbox: the smoke test checks the renderer really is sandboxed.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: xvfb-run -a npx playwright test -c playwright.desktop.config.ts

  live-ai:
    name: Live AI providers (runs only with key secrets)
    runs-on: ubuntu-latest
    # Real requests to real accounts. Add OPENAI_API_KEY, GEMINI_API_KEY and/or
    # ANTHROPIC_API_KEY as repository secrets to turn each provider on. Never on
    # pull requests from forks (secrets are not available there anyway).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kaatchat/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run test:live

  windows-installer:
    name: Windows installer
    # Never publish if any test failed — including the live AI checks when their
    # secrets exist (the job is skipped on fork PRs, which is fine).
    needs: [web, desktop, live-ai]
    if: ${{ !cancelled() && needs.web.result == 'success' && needs.desktop.result == 'success' && (needs.live-ai.result == 'success' || needs.live-ai.result == 'skipped') }}
    # Built and install-tested on every run, so a broken installer is caught before a
    # release; only a tag or a manual "publish" run publishes it.
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            kaatchat/package-lock.json
            kaatchat/desktop/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: kaatchat/dist
      - run: npm ci
        working-directory: kaatchat/desktop
      - name: Build NSIS installer
        working-directory: kaatchat/desktop
        env:
          # Signing is used automatically when these secrets exist; otherwise the build is unsigned.
          CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npm run dist:win
      - name: Checksums
        shell: pwsh
        working-directory: kaatchat/desktop/release
        run: |
          Get-ChildItem *.exe | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_.Name } | Tee-Object SHA256SUMS.txt
      - name: Install it (silent, per-user — what the one-click installer does)
        shell: pwsh
        working-directory: kaatchat/desktop/release
        run: |
          $exe = (Get-ChildItem Kaatchat-Setup-*.exe).FullName
          Start-Process -FilePath $exe -ArgumentList '/S' -Wait
          # One-click per-user installs go under %LOCALAPPDATA%\Programs\<package name>; find it rather than assume.
          $programs = Join-Path $env:LOCALAPPDATA 'Programs'
          $app = Get-ChildItem $programs -Recurse -Depth 2 -Filter 'Kaatchat.exe' -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $app) { Get-ChildItem $programs -Recurse -Depth 2 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }; Write-Error "Kaatchat.exe was not found under $programs after installing"; exit 1 }
          "KAATCHAT_EXE=$app" | Out-File -FilePath $env:GITHUB_ENV -Append
          "KAATCHAT_DIR=$(Split-Path $app)" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Installed: $app"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ffmpeg for test media
        shell: pwsh
        run: |
          python -m pip install --quiet imageio-ffmpeg
          $ff = python -c "import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())"
          "FFMPEG=$ff" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Test the installed app
        working-directory: kaatchat
        run: |
          npm ci --ignore-scripts
          npx playwright test -c playwright.installed.config.ts
      - name: Uninstall it cleanly
        shell: pwsh
        run: |
          $dir = $env:KAATCHAT_DIR
          Start-Process -FilePath (Join-Path $dir 'Uninstall Kaatchat.exe') -ArgumentList '/S' -Wait
          Start-Sleep -Seconds 5
          if (Test-Path (Join-Path $dir 'Kaatchat.exe')) { Write-Error 'Kaatchat.exe is still there after uninstalling'; exit 1 }
          Write-Host 'Uninstalled.'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: installed-test-results
          path: kaatchat/test-results
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          retention-days: 14
          path: |
            kaatchat/desktop/release/*.exe
            kaatchat/desktop/release/SHA256SUMS.txt
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/kaatchat-v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        shell: pwsh
        working-directory: kaatchat/desktop/release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag push names the release; a manual publish derives it from the app version
          # and creates the tag on this exact commit.
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "kaatchat-v" + (Get-Content ../package.json -Raw | ConvertFrom-Json).version }
          $signed = if ("${{ secrets.WIN_CSC_LINK }}" -ne "") { "Signed" } else { "**Unsigned build.** Windows SmartScreen may warn that the publisher is unknown. Verify the SHA-256 below before running." }
          $sums = Get-Content SHA256SUMS.txt -Raw
          $notes = "Kaatchat $tag`n`n$signed`n`nSystem requirements: Windows 10/11 64-bit, a GPU/CPU with hardware video decode recommended.`n`nSHA-256:`n```````n$sums`n``````"
          $exe = (Get-ChildItem *.exe).FullName
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            # Only replace files on a release whose tag is this exact commit, so a tag's
            # binaries always match its source. A later commit needs a version bump.
            $tagSha = gh api "repos/${{ github.repository }}/commits/$tag" --jq .sha
            if ($tagSha -ne "${{ github.sha }}") {
              Write-Error "Release $tag already exists at $tagSha, not ${{ github.sha }}. Bump the version in kaatchat/desktop/package.json to publish this commit."
              exit 1
            }
            gh release upload $tag $exe SHA256SUMS.txt --clobber
          } else {
            gh release create $tag $exe SHA256SUMS.txt --target "${{ github.sha }}" --title "Kaatchat $tag" --notes $notes --prerelease
          }

  macos-app:
    name: macOS app
    needs: [web, desktop, live-ai]
    if: ${{ !cancelled() && needs.web.result == 'success' && needs.desktop.result == 'success' && (needs.live-ai.result == 'success' || needs.live-ai.result == 'skipped') }}
    # Apple Silicon and Intel .dmg files, built and install-tested on every run
    # (the Apple Silicon one is launched and exercised; this runner is arm64).
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            kaatchat/package-lock.json
            kaatchat/desktop/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: kaatchat/dist
      - run: npm ci
        working-directory: kaatchat/desktop
      - name: Build .dmg (Apple Silicon and Intel)
        working-directory: kaatchat/desktop
        env:
          # With a Developer ID certificate and Apple ID secrets the app is signed and
          # notarized; without them it is ad-hoc signed (runs after "Open Anyway").
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CSC_LINK" ]; then
            npm run dist:mac -- -c.mac.notarize=true
          else
            unset CSC_LINK CSC_KEY_PASSWORD
            CSC_IDENTITY_AUTO_DISCOVERY=false npm run dist:mac -- -c.mac.identity=-
          fi
      - name: Check both apps' architecture and signature
        working-directory: kaatchat/desktop/release
        run: |
          set -e
          ls -la
          for arch in arm64 x64; do
            dmg=$(ls Kaatchat-*-mac-$arch.dmg)
            mnt=$(mktemp -d)
            hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mnt" >/dev/null
            bin="$mnt/Kaatchat.app/Contents/MacOS/Kaatchat"
            want=$([ $arch = arm64 ] && echo arm64 || echo x86_64)
            got=$(lipo -archs "$bin")
            echo "$dmg: $got"
            [ "$got" = "$want" ] || { echo "expected $want"; exit 1; }
            codesign --verify --deep --strict --verbose=2 "$mnt/Kaatchat.app"
            hdiutil detach "$mnt" >/dev/null
          done
          shasum -a 256 *.dmg | tee SHA256SUMS-mac.txt
      - name: Install it (copy the app out of the .dmg into Applications)
        working-directory: kaatchat/desktop/release
        run: |
          mnt=$(mktemp -d)
          hdiutil attach "$(ls Kaatchat-*-mac-arm64.dmg)" -nobrowse -readonly -mountpoint "$mnt" >/dev/null
          mkdir -p "$HOME/Applications"
          cp -R "$mnt/Kaatchat.app" "$HOME/Applications/"
          hdiutil detach "$mnt" >/dev/null
          echo "KAATCHAT_EXE=$HOME/Applications/Kaatchat.app/Contents/MacOS/Kaatchat" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: ffmpeg for test media
        run: |
          python -m pip install --quiet imageio-ffmpeg
          echo "FFMPEG=$(python -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())')" >> "$GITHUB_ENV"
      - name: Test the installed app
        working-directory: kaatchat
        run: |
          npm ci --ignore-scripts
          npx playwright test -c playwright.installed.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: installed-mac-test-results
          path: kaatchat/test-results
      - uses: actions/upload-artifact@v4
        with:
          name: macos-app
          retention-days: 14
          path: |
            kaatchat/desktop/release/*.dmg
            kaatchat/desktop/release/SHA256SUMS-mac.txt
      - name: Add to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/kaatchat-v') || (github.event_name == 'workflow_dispatch' && inputs.publish)
        working-directory: kaatchat/desktop/release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The Windows job creates the release; wait for it (up to 40 minutes).
          if [ "${{ github.ref_type }}" = "tag" ]; then tag="${{ github.ref_name }}"; else tag="kaatchat-v$(node -p "require('../package.json').version")"; fi
          for i in $(seq 1 80); do gh release view "$tag" >/dev/null 2>&1 && break; sleep 30; done
          gh release view "$tag" >/dev/null
          tagSha=$(gh api "repos/${{ github.repository }}/commits/$tag" --jq .sha)
          [ "$tagSha" = "${{ github.sha }}" ] || { echo "Release $tag is at $tagSha, not ${{ github.sha }}"; exit 1; }
          gh release upload "$tag" *.dmg SHA256SUMS-mac.txt --clobber
